services:
  - type: web
    name: careerverse-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FRONTEND_URL
        value: https://career-verse-one.vercel.app
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://career-verse-one.vercel.app
